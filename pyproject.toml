[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toroidamp"
version = "0.2.1"
description = "Compact, modular, musically reactive audio player with demoscene visualizer engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ToroidAMP Contributors" }
]
keywords = ["audio", "player", "demoscene", "visualizer", "tracker", "mod", "xm", "it", "s3m", "pyside6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "PySide6>=6.6.0",
    "pygame-ce>=2.5.0",
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",
    "miniaudio>=1.59",
]

[project.optional-dependencies]
# Only needed to run tools/generate_ico.py (regenerating the Windows .ico
# from the branding master) — never required to run ToroidAMP itself.
dev = ["Pillow>=10.0"]

[project.scripts]
toroidamp = "toroidamp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# BRAND-001: ships the operational branding master (and its Windows .ico
# derivative) inside the installed package, so the application icon
# resolves correctly for a real wheel/sdist install, not only an editable
# checkout. The full-resolution creative source (assets/images/) is
# intentionally excluded — it is never loaded at runtime.
toroidamp = ["assets/branding/*.png", "assets/branding/*.ico"]
